# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/surgeflow?TimeZone=UTC
spring.datasource.username=surgeflow
spring.datasource.password=surgeflow123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=surgeflow-consumers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=500
surgeflow.kafka.topic=surgeflow-transactions

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
logging.level.com.surgeflow=INFO

# OpenTelemetry
spring.application.name=surgeflow
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://172.18.0.6:4318/v1/traces
